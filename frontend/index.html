<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fish Audio</title>
    <script>
      // Respeta el tema del sistema operativo antes de pintar, para evitar el parpadeo
      // de tema claro -> oscuro. Bootstrap 5.3 lee este atributo directamente.
      document.documentElement.dataset.bsTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
